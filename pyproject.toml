[project]
name = "project-nexus-backend"
version = "0.1.0"
description = "Project NEXUS Backend: AI Agent System & 3D Portfolio API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "redis[hiredis]>=5.2.0",
    "aio-pika>=9.4.0",
    "chromadb>=0.5.0",
    "langgraph>=0.2.0",
    "langchain>=0.3.0",
    "langchain-core>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-google-genai>=2.0.0",
    "groq>=0.11.0",
    "google-generativeai>=0.8.0",
    "structlog>=24.4.0",
    "python-dotenv>=1.0.1",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pre-commit>=4.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "C4", "UP", "RUF"]
ignore = ["E501"] # Let ruff formatter handle line length

[tool.mypy]
python_version = "3.13"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# Third-party packages without PEP 561 py.typed markers.
# Our own application code remains fully strict.
[[tool.mypy.overrides]]
module = [
    "alembic.*",
    "aio_pika.*",
    "chromadb.*",
    "google.generativeai.*",
]
ignore_missing_imports = true

# -----------------------------------------------------------------------------
# Build System Configuration
# -----------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["app"]