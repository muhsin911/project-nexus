# -----------------------------------------------------------------------------
# Project NEXUS — Alembic configuration (Async SQLAlchemy 2.0)
# -----------------------------------------------------------------------------
[alembic]
script_location = alembic
prepend_sys_path = .
path_separator = os
output_encoding = utf-8

# Intentionally blank. app/core/config.py::Settings is the single source of
# truth for connection credentials. env.py injects the async URL at runtime.
sqlalchemy.url =

# -----------------------------------------------------------------------------
# Logging
# -----------------------------------------------------------------------------
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S